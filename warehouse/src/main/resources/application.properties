spring.application.name=warehouse-storefront

# ─── MySQL (Azure Database for MySQL / local) ────────────────────────────────
#spring.datasource.url=${MYSQL_URL:jdbc:mysql://warehouse-sql-student.mysql.database.azure.com:3306/warehouse_db?useSSL=true}
#spring.datasource.username=${MYSQL_USER:warehouseAdmin}
#spring.datasource.password=${MYSQL_PASSWORD:urAz34@1!}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ─── MongoDB (Azure Cosmos DB MongoDB API / local) ───────────────────────────
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=warehouse_db

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Generate with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:JZqixmPqH3jxSjUVc9r56EoIHzlBoZR5j7EgyXunM799BtnZVxmENDpuszczCBXSuvo0tXCWFjwZGUdbXRkq3A==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.example.warehouse=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
