spring.application.name=warehouse-storefront

# ─── MySQL (Azure Database for MySQL / local) ────────────────────────────────
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/warehouse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ─── MongoDB (Azure Cosmos DB MongoDB API / local) ───────────────────────────
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/warehouse_mongo_db}

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Generate with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:CHANGEME_use_a_64+_char_base64_secret_in_production_CHANGEME}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.example.warehouse=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
